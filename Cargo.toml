[package]
name = "systemstat-tui"
version = "0.0.1"
edition = "2021"
description = "SystemStat — a terminal system-monitor dashboard (Raspberry Pi friendly)"

# The package is `systemstat-tui` (the crates.io name `systemstat` is taken), but
# the installed command stays `systemstat`.
[[bin]]
name = "systemstat"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
sysinfo = "0.30"
# Supplementary backend for signals sysinfo lacks (battery, AC power, portable
# CPU temperature). Keep sysinfo primary; systemstat is the cross-platform backstop.
systemstat = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
