[package]
name = "systemstat-tui"
version = "0.0.1"
edition = "2021"
description = "SystemStat — a terminal system-monitor dashboard (Raspberry Pi friendly)"
# NOTE: defaulted to MIT — change if you prefer another license.
license = "MIT"
repository = "https://github.com/Blevene/systemstat"
readme = "README.md"

# The package is `systemstat-tui` (the crates.io name `systemstat` is taken), but
# the installed command stays `systemstat`.
[[bin]]
name = "systemstat"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Blevene <blevene@users.noreply.github.com>"
copyright = "2026, Blevene"
section = "utils"
priority = "optional"
extended-description = """\
A single-binary terminal system-monitor dashboard: CPU/thermal, memory/storage, \
network, power/health, GPU (when present), a process view, and a derived \
insights summary. Cross-platform via sysinfo, with richer Linux signals read \
directly when available."""
assets = [
    ["target/release/systemstat", "usr/bin/", "755"],
    ["config.example.toml", "usr/share/doc/systemstat/", "644"],
    ["docs/systemstat.service", "usr/share/doc/systemstat/", "644"],
    ["README.md", "usr/share/doc/systemstat/README.md", "644"],
    ["LICENSE", "usr/share/doc/systemstat/", "644"],
]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
sysinfo = "0.30"
# Supplementary backend for signals sysinfo lacks (battery, AC power, portable
# CPU temperature). Keep sysinfo primary; systemstat is the cross-platform backstop.
systemstat = "0.2"
# Only the `flag` + `consts` API is used; drop the iterator/channel machinery.
signal-hook = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
