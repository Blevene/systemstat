name: Release

# Cut a release by pushing a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu # desktop / server (dynamic)
          - x86_64-unknown-linux-musl # desktop / server (static)
          - aarch64-unknown-linux-gnu # 64-bit Raspberry Pi OS
          - armv7-unknown-linux-gnueabihf # 32-bit Raspberry Pi OS
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          dist="systemstat-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/systemstat" "$dist/"
          cp README.md "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: systemstat-*.tar.gz
          fail_on_unmatched_files: true

  deb:
    name: debian package (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          fail_on_unmatched_files: true
